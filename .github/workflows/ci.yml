name: CI

# Fast checks on every push and pull request. Full app builds run in build.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy -p lancelot-core -p lancelot-service -p lancelot-bridge --all-targets -- -D warnings
      - run: cargo test -p lancelot-core -p lancelot-service -p lancelot-bridge
      # cargo test regenerates the TypeScript types and the UI's example event;
      # the committed ones must match.
      - name: Generated UI files are up to date
        run: |
          git diff --exit-code -- app/src/lib/api/generated app/src/lib/api/fixtures/*.json
          test -z "$(git status --porcelain -- app/src/lib/api/generated app/src/lib/api/fixtures)"

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in app/package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

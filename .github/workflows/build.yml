name: Build

# Full app build per platform. The repository is private and macOS/Windows minutes are
# expensive, so all three platforms run weekly and on demand. Pull requests that touch
# dependencies or the Tauri shell get the Linux build only.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - app/package.json
      - app/pnpm-lock.yaml
      - app/src-tauri/**
      - .github/workflows/build.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and friends
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # cargo test regenerates the TypeScript types and the UI's example event;
      # the committed ones must match.
      - name: Generated UI files are up to date
        # Windows checkouts may convert line endings; Linux and macOS cover this.
        if: runner.os != 'Windows'
        shell: bash
        working-directory: .
        run: |
          git diff --exit-code -- app/src/lib/api/generated app/src/lib/api/fixtures/*.json
          test -z "$(git status --porcelain -- app/src/lib/api/generated app/src/lib/api/fixtures)"
      - run: pnpm tauri build --debug --no-bundle

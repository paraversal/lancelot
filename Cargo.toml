[workspace]
resolver = "3"
members = ["crates/lancelot-core", "crates/lancelot-service", "crates/lancelot-bridge", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/paraversal/lancelot"

[workspace.dependencies]
lancelot-core = { path = "crates/lancelot-core" }
lancelot-service = { path = "crates/lancelot-service" }
calamine = { version = "0.37", default-features = false }
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
time = { version = "0.3.47", features = ["serde-human-readable", "macros", "formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
